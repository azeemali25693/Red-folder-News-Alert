<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fc">
<title>Red folder news</title>
<style>
:root{color-scheme:light;--bg:#f3f6fc;--s1:#ffffff;--s2:#e7edf8;--line:#dde4f0;--ink:#0f1a2e;--muted:#64708a;--red:#2563eb;--red2:#3b9cff;--glow:rgba(37,99,235,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(520px 280px at 90% -60px,rgba(37,99,235,.14),transparent 70%),radial-gradient(420px 260px at -10% 30%,rgba(56,163,255,.06),transparent 70%),var(--bg);background-repeat:no-repeat;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9;overflow:hidden;opacity:0;transition:opacity .25s}
#bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--red),var(--red2),transparent);animation:slide 1.05s ease-in-out infinite}
.loading #bar{opacity:1}
@keyframes slide{from{left:-40%}to{left:100%}}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 12px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 var(--glow);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.sub{color:var(--muted);font-size:13.5px;margin:3px 0 0}
button{font:inherit;border:0;cursor:pointer;color:inherit;transition:transform .15s,background .2s}
button:active{transform:scale(.96)}
.icon{width:42px;height:42px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);border-radius:50%}
.loading #refresh svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s1);box-shadow:0 4px 12px -8px rgba(15,26,46,.3);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--glow)}
.today{background:linear-gradient(150deg,#d4261d 0%,#ee4234 60%,#ff6a4d 100%);color:#fff;border-radius:24px;padding:20px 18px 6px;margin:2px 0 8px;box-shadow:0 24px 44px -22px rgba(212,38,29,.7)}
.today.none{background:var(--s1);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding-bottom:18px}
.today .sub{color:rgba(255,255,255,.85)}
.today.none .sub{color:var(--muted)}
.today .ev{border-top-color:rgba(255,255,255,.25)}
.today .cur{background:rgba(255,255,255,.2);color:#fff}
.today .meta{color:rgba(255,255,255,.82)}
.today .meta b{color:#fff}
.today .ev.next{background:rgba(255,255,255,.17);box-shadow:inset 3px 0 0 #fff}
.today .nx{background:#fff;color:#d4261d}
.today h2{margin:0 0 4px;font-size:26px;line-height:1.15;letter-spacing:-.03em;font-weight:800}
.today.none h2{font-size:18px}
.ev{display:grid;grid-template-columns:78px 1fr;gap:0 12px;padding:14px 0;border-top:1px solid rgba(15,26,46,.08);align-items:start}
.today h2+.sub{margin-bottom:10px}
.day .ev:first-child{border-top:0}
.ev.past{opacity:.42}
.ev.next{background:linear-gradient(90deg,rgba(37,99,235,.13),transparent);box-shadow:inset 3px 0 0 var(--red);border-radius:12px;margin:0 -8px;padding-left:11px;padding-right:8px;border-top-color:transparent}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap;padding-top:1px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.cur{background:rgba(37,99,235,.1);color:#1d4ed8;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;letter-spacing:.02em}
.nx{background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.ttl{font-weight:600;font-size:15px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
h3{font-size:13.5px;margin:26px 4px 8px;color:var(--muted);font-weight:600}
.day{background:#fff6f5;border:1px solid rgba(212,38,29,.22);border-radius:20px;padding:0 16px;box-shadow:0 10px 24px -18px rgba(212,38,29,.5)}
.day .ev{border-top-color:rgba(212,38,29,.14)}
.day .cur{background:rgba(212,38,29,.12);color:#c0231b}
.status{font-size:12.5px;color:var(--muted);margin:20px 0 0;text-align:center}
.status.err{color:#c9241d}
.alertbtn{width:100%;margin-top:14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:15px;font-weight:700}
#alertbtn{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff;box-shadow:0 14px 28px -14px var(--glow)}
.sk{border-radius:24px;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.sk.h{height:200px}.sk.r{height:64px;margin-top:12px;border-radius:18px}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:2s!important}}
</style>
</head>
<body>
<div id="bar"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Red folder news</h1>
      <p class="sub" id="now"></p>
    </div>
    <button class="icon" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>
  <div class="chips" id="chips"></div>
  <section id="today"></section>
  <section id="week"></section>
  <button class="alertbtn" id="alertbtn" type="button">Turn on alerts</button>
  <button class="alertbtn" id="testbtn" type="button">Send test alert (10 sec)</button>
  <p class="status" id="status">Loading…</p>
  <p class="status" id="sched"></p>
</div>

<script>
var FEED = "https://nfs.faireconomy.media/ff_calendar_thisweek.json";
var PROXIES = [
  function (u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
  function (u) { return "https://corsproxy.io/?" + encodeURIComponent(u); }
];
var $ = function (id) { return document.getElementById(id); };
var events = [];
var filter = "ALL";
var lastList = [];

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

var TZ = "Asia/Karachi";
function dayKey(d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); }
function sameDay(a, b) { return dayKey(a) === dayKey(b); }
function fmtTime(d) { return d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) + " PKT"; }
function fmtDay(d) { return d.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" }); }

function parse(data) {
  return data
    .filter(function (e) { return e.impact === "High"; })
    .map(function (e) { e.d = new Date(e.date); return e; })
    .filter(function (e) { return !isNaN(e.d); })
    .sort(function (a, b) { return a.d - b.d; });
}

function fetchFeed() {
  var urls = [FEED].concat(PROXIES.map(function (p) { return p(FEED); }));
  var i = 0;
  function next() {
    if (i >= urls.length) return Promise.reject(new Error("all failed"));
    return fetch(urls[i++], { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { if (!Array.isArray(d)) throw new Error("bad data"); return d; })
      .catch(next);
  }
  return next();
}

function eventRow(e, now, isNext) {
  var row = el("div", "ev" + (e.d < now && sameDay(e.d, now) ? " past" : "") + (isNext ? " next" : ""));
  row.appendChild(el("span", "tm", fmtTime(e.d).replace(" PKT", "")));
  var b = el("div", "body"), top = el("div", "top");
  top.appendChild(el("span", "cur", e.country));
  if (isNext) top.appendChild(el("span", "nx", "Next"));
  b.appendChild(top);
  b.appendChild(el("div", "ttl", e.title));
  if (e.forecast || e.previous) {
    var m = el("div", "meta");
    [["Forecast", e.forecast], ["Previous", e.previous]].forEach(function (x) {
      if (!x[1]) return;
      var sp = el("span", "", x[0] + " ");
      sp.appendChild(el("b", "", x[1]));
      m.appendChild(sp);
    });
    b.appendChild(m);
  }
  row.appendChild(b);
  return row;
}

function skeleton() {
  var t = $("today"); t.textContent = ""; $("week").textContent = "";
  t.appendChild(el("div", "sk h"));
  for (var i = 0; i < 3; i++) t.appendChild(el("div", "sk r"));
}
function setLoading(on) {
  document.body.classList.toggle("loading", on);
  if (on && !events.length) skeleton();
}

function render() {
  var now = new Date();
  $("now").textContent = fmtDay(now);

  var currencies = [];
  events.forEach(function (e) { if (currencies.indexOf(e.country) < 0) currencies.push(e.country); });
  var chips = $("chips");
  chips.textContent = "";
  ["ALL"].concat(currencies).forEach(function (c) {
    var b = el("button", "chip" + (c === filter ? " on" : ""), c === "ALL" ? "All" : c);
    b.type = "button";
    b.onclick = function () { filter = c; save("rf_filter", c); render(); autoSchedule(); };
    chips.appendChild(b);
  });

  var list = events.filter(function (e) { return filter === "ALL" || e.country === filter; });
  var today = list.filter(function (e) { return sameDay(e.d, now); });
  lastList = list;

  var box = $("today");
  box.textContent = "";
  var card = el("div", "today" + (today.length ? "" : " none"));
  if (today.length) {
    var cs = [];
    today.forEach(function (e) { if (cs.indexOf(e.country) < 0) cs.push(e.country); });
    card.appendChild(el("h2", "", "Today: red folder news"));
    card.appendChild(el("p", "sub", cs.join(", ") + " – " + today.length + (today.length === 1 ? " event" : " events")));
    var nextEv = null;
    today.forEach(function (e) { if (!nextEv && e.d >= now) nextEv = e; });
    today.forEach(function (e) { card.appendChild(eventRow(e, now, e === nextEv)); });
  } else {
    card.appendChild(el("h2", "", "No red folder news today"));
    card.appendChild(el("p", "sub", filter === "ALL" ? "Aaj koi high-impact event nahi." : "Aaj " + filter + " ki koi high-impact event nahi."));
  }
  box.appendChild(card);

  var week = $("week");
  week.textContent = "";
  var days = {}, order = [];
  list.forEach(function (e) {
    if (sameDay(e.d, now) || e.d < now) return;
    var k = dayKey(e.d);
    if (!days[k]) { days[k] = []; order.push(k); }
    days[k].push(e);
  });
  order.forEach(function (k) {
    week.appendChild(el("h3", "", fmtDay(days[k][0].d)));
    var d = el("div", "day");
    days[k].forEach(function (e) { d.appendChild(eventRow(e, now)); });
    week.appendChild(d);
  });

  document.title = today.length ? "Red: " + today.length + " today" : "Red folder news";
  return today;
}

function notify(today) {
  if (!today.length) return;
  var key = new Date().toDateString();
  if (read("rf_alerted") === key) return;
  save("rf_alerted", key);
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
  try {
    if (window.Notification && Notification.permission === "granted") {
      new Notification("Today: red folder news", {
        body: today.map(function (e) { return e.country + " " + e.title + " " + fmtTime(e.d); }).join("\n")
      });
    }
  } catch (e) {}
}

function load() {
  var st = $("status");
  setLoading(true);
  st.className = "status";
  st.textContent = "Loading…";
  return fetchFeed().then(function (data) {
    events = parse(data);
    save("rf_cache", JSON.stringify(data));
    save("rf_time", String(Date.now()));
    st.textContent = "Updated " + fmtTime(new Date());
    notify(render());
    autoSchedule();
  }).catch(function () {
    var cached = read("rf_cache");
    if (cached) {
      try { events = parse(JSON.parse(cached)); } catch (e) { events = []; }
      var t = new Date(Number(read("rf_time")));
      st.className = "status err";
      st.textContent = "Internet ya feed nahi mila. Purana data dikh raha hai (" + t.toLocaleString() + ").";
      notify(render());
    } else {
      st.className = "status err";
      st.textContent = "News load nahi hui. Internet check karke Refresh dabayein.";
      render();
    }
  }).then(function () { setLoading(false); });
}

$("refresh").onclick = load;
$("alertbtn").onclick = function () {
  var b = $("alertbtn");
  try { if (navigator.vibrate) navigator.vibrate(100); } catch (e) {}
  if (window.Notification && Notification.permission === "default") {
    Notification.requestPermission().then(function () { b.textContent = "Alerts: allowed (page khula rakhein)"; });
  } else {
    b.textContent = "Alerts: banner + vibration on (page khula rakhein)";
  }
};

var MORNING_HOUR = 8;
function getLN() {
  try { if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return Capacitor.Plugins.LocalNotifications || null; } catch (e) {}
  return null;
}
function hashId(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; }
function setupAlerts(LN) {
  return LN.requestPermissions().then(function (p) {
    if (p.display !== "granted") return false;
    return LN.createChannel({ id: "redfolder", name: "Red folder news", description: "High impact news alerts", importance: 5, visibility: 1, vibration: true })
      .then(function () { return true; }, function () { return true; });
  });
}
var SL_MSG = "Don't Revenge trade if SL hitt your day done \u26A0\uFE0F\u2705";
var SL_REMINDERS = [
  { hour: 7, key: "sl7", title: SL_MSG },
  { hour: 19, key: "sl19", title: SL_MSG }
];
function opt(k) { return read(k) !== "off"; }
function mk(key, title, body, atMs) {
  var n = { id: hashId(key), title: title, body: body, schedule: { at: new Date(atMs), allowWhileIdle: true }, channelId: "redfolder" };
  if (body) n.largeBody = body;
  return n;
}
function buildAlerts(list) {
  var now = Date.now(), out = [], days = {};
  {
    list.forEach(function (e) {
      var t = e.d.getTime(), name = e.country + " " + e.title;
      var tail = [e.forecast ? "Forecast " + e.forecast : "", e.previous ? "Previous " + e.previous : ""].filter(Boolean).join(" | ");
      if (t - 300000 > now) {
        out.push(mk("b" + e.date + name, name + " \u2013 5 min baad", "News " + fmtTime(e.d) + (tail ? "\n" + tail : ""), t - 300000));
        out.push(mk("w" + e.date + name, "\u26A0\uFE0FWait for my confirmation then trade", "", t - 299000));
      }
      if (t + 300000 > now) out.push(mk("a" + e.date + name, "Trade Permission Allowed\u2705", "", t + 300000));
      var k = dayKey(e.d);
      (days[k] = days[k] || []).push(e);
    });
    Object.keys(days).forEach(function (k) {
      var at = new Date(k + "T" + ("0" + MORNING_HOUR).slice(-2) + ":00:00+05:00");
      var rest = days[k].filter(function (e) { return e.d > at; });
      if (at.getTime() <= now || !rest.length) return;
      var body = rest.map(function (e) { return e.country + " " + e.title + " \u2013 " + fmtTime(e.d); }).join("\n");
      out.push(mk("am" + k, "Aaj red folder news (" + rest.length + ")", body, at.getTime()));
    });
  }
  {
    var base = new Date(dayKey(new Date(now)) + "T00:00:00+05:00").getTime();
    for (var d = 0; d < 7; d++) {
      SL_REMINDERS.forEach(function (r) {
        var at2 = base + d * 86400000 + r.hour * 3600000;
        if (at2 <= now) return;
        out.push(mk(r.key + at2, r.title, "", at2));
      });
    }
  }
  return out;
}
function autoSchedule() {
  var LN = getLN(), s = $("sched");
  s.className = "status";
  if (!LN) { s.textContent = "Browser mode: alert sirf page khula ho tab. APK mein phone alerts milte hain."; return Promise.resolve(); }
  return setupAlerts(LN).then(function (ok) {
    if (!ok) { s.className = "status err"; s.textContent = "Notifications band hain. Phone Settings > Apps > Red Folder > Notifications on karein."; return; }
    var items = buildAlerts(events);
    return LN.getPending().then(function (p) {
      return p.notifications.length ? LN.cancel({ notifications: p.notifications.map(function (n) { return { id: n.id }; }) }) : null;
    }).then(function () {
      return items.length ? LN.schedule({ notifications: items }) : null;
    }).then(function () {
      s.textContent = items.length + " alerts set (agle 7 din ke liye)";
    });
  }).catch(function (e) { s.className = "status err"; s.textContent = "Alerts set nahi hue: " + (e && e.message ? e.message : e); });
}
var webAlert = $("alertbtn").onclick;
$("alertbtn").onclick = function () { if (getLN()) autoSchedule(); else webAlert(); };
$("testbtn").onclick = function () {
  var LN = getLN(), s = $("sched");
  if (!LN) { s.textContent = "Test sirf APK mein chalta hai."; return; }
  setupAlerts(LN).then(function (ok) {
    if (!ok) { s.className = "status err"; s.textContent = "Notification permission allow karein."; return; }
    return LN.schedule({ notifications: [{ id: 999999999, title: "Test: red folder alert", body: "Ye dikh raha hai to alerts theek hain.", schedule: { at: new Date(Date.now() + 10000), allowWhileIdle: true }, channelId: "redfolder" }] })
      .then(function () { s.className = "status"; s.textContent = "Test alert 10 second mein aayega. App minimize kar dein."; });
  }).catch(function (e) { s.className = "status err"; s.textContent = "Test fail: " + (e && e.message ? e.message : e); });
};

var saved = read("rf_filter");
if (saved) filter = saved;
load();
setInterval(load, 30 * 60 * 1000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
</script>
</body>
</html>

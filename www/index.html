<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fc">
<title>Red folder news</title>
<style>
html,body{margin:0;height:100%;background:#f3f6fc}
.l{position:fixed;inset:0;display:grid;place-items:center}
.d{width:44px;height:44px;border-radius:50%;border:4px solid #dde4f0;border-top-color:#2563eb;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="l"><div class="d"></div></div>
<script>
// Loader: ye file kabhi change nahi karni. Asli app www/app.html hai.
// APK banate waqt __APP_URL__ GitHub se khud replace ho jata hai.
var APP_URL = "__APP_URL__";
var KEY = "rf_app_html";
var WAIT_MS = 4000;

function remote() {
  var req = fetch(APP_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
    .then(function (h) { if (h.indexOf("</html>") < 0) throw new Error("bad html"); return h; });
  var timer = new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, WAIT_MS); });
  return Promise.race([req, timer]);
}
function cached() {
  var h = null;
  try { h = localStorage.getItem(KEY); } catch (e) {}
  return h ? Promise.resolve(h) : Promise.reject(new Error("no cache"));
}
function bundled() {
  return fetch("app.html").then(function (r) { return r.text(); });
}
function show(html) {
  document.open();
  document.write(html);
  document.close();
}

remote()
  .then(function (h) { try { localStorage.setItem(KEY, h); } catch (e) {} return h; })
  .catch(cached)
  .catch(bundled)
  .then(show);
</script>
</body>
</html>

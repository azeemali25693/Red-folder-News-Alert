<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27457a">
<title>Red folder news</title>
<style id="app-css">
/*CSS_START*/
:root{color-scheme:light;--bg:#eef1f6;--row:#fff;--line:#dde2ea;--ink:#1c2433;--muted:#7a8497;--navy:#27457a;--navy2:#6f82ab;--green:#3f9b45;--red:#d4261d;--g:52px 32px 18px 1fr 46px 46px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.35 Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:640px;margin:0 auto}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9;overflow:hidden;opacity:0;transition:opacity .25s}
#bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,#fff,var(--green),transparent);animation:slide 1.05s ease-in-out infinite}
.loading #bar{opacity:1}
@keyframes slide{from{left:-40%}to{left:100%}}
header{background:var(--navy);border-bottom:3px solid var(--green);padding-top:env(safe-area-inset-top);color:#fff}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px}
h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap}
.sub{color:#b9c6e3;font-size:12.5px;margin:2px 0 0;font-variant-numeric:tabular-nums}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;transition:transform .15s,background .2s}
button:active{transform:scale(.96)}
.hbtns{display:flex;align-items:center;gap:8px;flex:none}
.icon{width:40px;height:40px;display:grid;place-items:center;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:50%;box-shadow:0 4px 12px -8px rgba(15,26,46,.35)}
.loading #refresh svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.test3d{height:38px;padding:0 11px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;letter-spacing:.01em;color:#fff;background:linear-gradient(180deg,#f44336 0%,#d4261d 100%);border:1px solid #b91c1c;box-shadow:0 4px 0 #991b1b,0 8px 16px -6px rgba(212,38,29,.55);transition:transform .08s,box-shadow .08s}
.test3d:active{transform:translateY(3px);box-shadow:0 1px 0 #991b1b,0 3px 6px -3px rgba(212,38,29,.45)}
.test3d span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.fbar{background:#fff;border-bottom:1px solid var(--line)}
.chips{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.chip.on{color:var(--navy);border-bottom-color:var(--navy)}
.ch,.ev{display:grid;grid-template-columns:var(--g);gap:0 4px;align-items:center;padding:0 8px}
.ch{background:var(--navy2);color:#fff;font-size:11.5px;font-weight:600;height:28px}
.ch span:nth-child(n+5){text-align:right}
.dh{display:flex;align-items:center;justify-content:space-between;background:#f7f8fb;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 10px;margin-top:10px;font-weight:700;font-size:14px}
#today .dh{margin-top:0;border-top:0}
.tag{background:var(--red);color:#fff;border-radius:3px;padding:1px 7px;font-size:11px;font-weight:700}
.tbl{background:var(--row);border-bottom:1px solid var(--line)}
.ev{min-height:46px;padding-top:8px;padding-bottom:8px;border-top:1px solid #e9edf3}
.tbl .ev:first-child{border-top:0}
.ev.past .tm,.ev.past .cu,.ev.past .ttl,.ev.past .nu{color:#a0a8b8}
.ev.next{background:#fff6cc}
.tm{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cu{font-weight:700;font-size:13px}
.fo{width:16px;height:12px;background:var(--red);border-radius:2px;position:relative;justify-self:center}
.fo::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:4px;background:var(--red);border-radius:2px 2px 0 0}
.ttl{font-weight:500;font-size:14px;line-height:1.3}
.cd{display:inline-block;margin-left:8px;border:1px solid #b9c3d9;background:#fff;color:var(--navy);border-radius:4px;padding:0 5px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.nu{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.nu:last-child{color:var(--muted)}
.none{padding:16px 10px;color:var(--muted);font-size:13.5px}
.status{font-size:12px;color:var(--muted);margin:12px 10px 0;text-align:center}
.status.err{color:#c9241d}
.sk{height:46px;border-top:1px solid #e9edf3;background:linear-gradient(100deg,#fff 30%,#eef1f6 50%,#fff 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:2s!important}}
/*CSS_END*/
</style>
</head>
<body>
<div id="app-root">
<!--BODY_START-->
<div id="bar"></div>
<header>
  <div class="wrap hd">
    <div>
      <h1>Red folder news</h1>
      <p class="sub" id="now"></p>
    </div>
    <div class="hbtns">
      <button class="test3d" id="testbtn" type="button" aria-label="Send test alert (10 sec)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Test</span>
      </button>
      <button class="icon" id="refresh" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="fbar"><div class="wrap chips" id="chips"></div></div>
<div class="wrap">
  <div class="ch"><span>Time</span><span>Cur</span><span></span><span>Event</span><span>Fcst</span><span>Prev</span></div>
  <section id="today"></section>
  <section id="week"></section>
  <p class="status" id="status">Loading…</p>
  <p class="status" id="sched"></p>
  <p class="status" id="ota"></p>
</div>
<!--BODY_END-->
</div>

<script id="app-js" type="text/plain">
//JS_START
var FEED = "https://nfs.faireconomy.media/ff_calendar_thisweek.json";
var PROXIES = [
  function (u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
  function (u) { return "https://corsproxy.io/?" + encodeURIComponent(u); }
];
var $ = function (id) { return document.getElementById(id); };
var events = [];
var filter = "ALL";
var lastList = [];
var lastRaw = "";
var lastStateKey = "";
var lastDayKey = "";

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

var TZ = "Asia/Karachi";
function dayKey(d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); }
function sameDay(a, b) { return dayKey(a) === dayKey(b); }
function fmtTime(d) { return d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) + " PKT"; }
function fmtClock(d) { return d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit" }); }
function fmtDay(d) { return d.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" }); }
function fmtDayShort(d) { return d.toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" }).replace(",", ""); }
function fmtRow(d) { return fmtTime(d).replace(" PKT", "").replace(/\s*([AP])M/i, function (m, p) { return p.toLowerCase() + "m"; }); }
function fmtCd(ms) {
  var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? h + "h " + ("0" + m).slice(-2) + "m" : m + ":" + ("0" + x).slice(-2);
}

function parse(data) {
  return data
    .filter(function (e) { return e.impact === "High"; })
    .map(function (e) { e.d = new Date(e.date); return e; })
    .filter(function (e) { return !isNaN(e.d); })
    .sort(function (a, b) { return a.d - b.d; });
}

function fetchWithTimeout(url, ms) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      reject(new Error("timeout"));
    }, ms);
    fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (!Array.isArray(d)) throw new Error("bad data");
        resolve(d);
      })
      .catch(function (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(err);
      });
  });
}

function fetchFeed() {
  var urls = [FEED].concat(PROXIES.map(function (p) { return p(FEED); }));
  var i = 0;
  var lastErr = null;
  function next(err) {
    if (err) lastErr = err;
    if (i >= urls.length) return Promise.reject(lastErr || new Error("all failed"));
    return fetchWithTimeout(urls[i++], 7000).catch(next);
  }
  return next();
}

function eventRow(e, now, isNext) {
  var row = el("div", "ev" + (e.d < now ? " past" : "") + (isNext ? " next" : ""));
  row.appendChild(el("span", "tm", fmtRow(e.d)));
  row.appendChild(el("span", "cu", e.country));
  row.appendChild(el("span", "fo"));
  var t = el("div", "ttl", e.title);
  if (isNext) {
    var c = el("span", "cd", fmtCd(e.d - now));
    c.setAttribute("data-t", String(e.d.getTime()));
    t.appendChild(c);
  }
  row.appendChild(t);
  row.appendChild(el("span", "nu", e.forecast || ""));
  row.appendChild(el("span", "nu", e.previous || ""));
  return row;
}

function dayBlock(evs, now, isToday, nextEv) {
  var f = document.createDocumentFragment();
  var h = el("div", "dh");
  h.appendChild(el("span", "", fmtDayShort(evs.length ? evs[0].d : now)));
  if (isToday) h.appendChild(el("span", "tag", "Today"));
  f.appendChild(h);
  var t = el("div", "tbl");
  if (!evs.length) t.appendChild(el("div", "none", filter === "ALL" ? "Aaj koi high-impact event nahi." : "Aaj " + filter + " ki koi high-impact event nahi."));
  evs.forEach(function (e) { t.appendChild(eventRow(e, now, e === nextEv)); });
  f.appendChild(t);
  return f;
}

function skeleton() {
  var t = $("today"); t.textContent = ""; $("week").textContent = "";
  var b = el("div", "tbl");
  for (var i = 0; i < 6; i++) b.appendChild(el("div", "sk"));
  t.appendChild(b);
}
function setLoading(on) {
  document.body.classList.toggle("loading", on);
  if (on && !events.length) skeleton();
}

function updateClock(now) {
  $("now").textContent = fmtDay(now) + " \u2022 " + fmtClock(now);
}

function stateSig(now) {
  return dayKey(now) + "|" + events.map(function (e) { return e.d < now ? "1" : "0"; }).join("");
}

function render() {
  var now = new Date();
  updateClock(now);
  lastStateKey = stateSig(now);
  lastDayKey = dayKey(now);

  var currencies = [];
  events.forEach(function (e) { if (currencies.indexOf(e.country) < 0) currencies.push(e.country); });
  var chips = $("chips");
  chips.textContent = "";
  ["ALL"].concat(currencies).forEach(function (c) {
    var b = el("button", "chip" + (c === filter ? " on" : ""), c === "ALL" ? "All" : c);
    b.type = "button";
    b.onclick = function () { filter = c; save("rf_filter", c); render(); autoSchedule(); };
    chips.appendChild(b);
  });

  var list = events.filter(function (e) { return filter === "ALL" || e.country === filter; });
  var today = list.filter(function (e) { return sameDay(e.d, now); });
  lastList = list;

  var nextEv = null;
  today.forEach(function (e) { if (!nextEv && e.d >= now) nextEv = e; });
  var box = $("today");
  box.textContent = "";
  box.appendChild(dayBlock(today, now, true, nextEv));

  var week = $("week");
  week.textContent = "";
  var days = {}, order = [];
  list.forEach(function (e) {
    if (sameDay(e.d, now) || e.d < now) return;
    var k = dayKey(e.d);
    if (!days[k]) { days[k] = []; order.push(k); }
    days[k].push(e);
  });
  order.forEach(function (k) { week.appendChild(dayBlock(days[k], now, false, null)); });

  document.title = today.length ? "Red: " + today.length + " today" : "Red folder news";
  return today;
}

function notify(today) {
  if (!today.length) return;
  var key = new Date().toDateString();
  if (read("rf_alerted") === key) return;
  save("rf_alerted", key);
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
  try {
    if (window.Notification && Notification.permission === "granted") {
      new Notification("Today: red folder news", {
        body: today.map(function (e) { return e.country + " " + e.title + " " + fmtTime(e.d); }).join("\n")
      });
    }
  } catch (e) {}
}

function load(force) {
  var st = $("status");
  var cached = read("rf_cache");
  var cachedAt = Number(read("rf_time") || 0);
  var fresh = cached && cachedAt && (Date.now() - cachedAt < 30 * 60 * 1000);
  if (!force && fresh) {
    try {
      lastRaw = cached;
      events = parse(JSON.parse(cached));
      st.className = "status";
      st.textContent = "Synced " + fmtTime(new Date(cachedAt));
      notify(render());
      autoSchedule();
      return Promise.resolve();
    } catch (e) {}
  }
  setLoading(true);
  st.className = "status";
  st.textContent = "Loading…";
  return fetchFeed().then(function (data) {
    var raw = JSON.stringify(data);
    var changed = raw !== lastRaw;
    lastRaw = raw;
    events = parse(data);
    save("rf_cache", raw);
    save("rf_time", String(Date.now()));
    st.className = "status";
    st.textContent = "Updated " + fmtTime(new Date());
    var today = render();
    notify(today);
    if (changed || !force) autoSchedule();
  }).catch(function (err) {
    if (cached) {
      if (!events.length) {
        try { events = parse(JSON.parse(cached)); } catch (e) { events = []; }
        notify(render());
        autoSchedule();
      }
      var t = new Date(cachedAt);
      var msg = String(err && err.message || "");
      st.className = "status" + (Date.now() - cachedAt > 6 * 3600 * 1000 ? " err" : "");
      st.textContent = (msg.indexOf("429") >= 0 ? "Feed rate-limit (thori der baad try karein)" : "Feed busy/offline") + " \u2022 Data: " + fmtTime(t);
    } else {
      st.className = "status err";
      st.textContent = "News load nahi hui. Internet check karke Refresh dabayein.";
      render();
    }
  }).then(function () { setLoading(false); });
}

$("refresh").onclick = function () {
  load(true);
  checkWebUpdate();
};

var MORNING_HOUR = 8;
function getLN() {
  try { if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return Capacitor.Plugins.LocalNotifications || null; } catch (e) {}
  return null;
}
function hashId(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; }
function setupAlerts(LN) {
  return LN.requestPermissions().then(function (p) {
    if (p.display !== "granted") return false;
    return LN.createChannel({ id: "redfolder", name: "Red folder news", description: "High impact news alerts", importance: 5, visibility: 1, vibration: true })
      .then(function () { return true; }, function () { return true; });
  });
}
var SL_MSG = "Don't Revenge trade if SL hitt your day done \u26A0\uFE0F\u2705";
var SL_REMINDERS = [
  { hour: 7, key: "sl7", title: SL_MSG },
  { hour: 19, key: "sl19", title: SL_MSG }
];
function mk(key, title, body, atMs) {
  var n = { id: hashId(key), title: title, body: body, schedule: { at: new Date(atMs), allowWhileIdle: true }, channelId: "redfolder" };
  if (body) n.largeBody = body;
  return n;
}
function buildAlerts(list) {
  var now = Date.now(), out = [], days = {};
  {
    list.forEach(function (e) {
      var t = e.d.getTime(), name = e.country + " " + e.title;
      var tail = [e.forecast ? "Forecast " + e.forecast : "", e.previous ? "Previous " + e.previous : ""].filter(Boolean).join(" | ");
      if (t - 300000 > now) {
        out.push(mk("b" + e.date + name, name + " \u2013 5 min baad", "News " + fmtTime(e.d) + (tail ? "\n" + tail : ""), t - 300000));
        out.push(mk("w" + e.date + name, "\u26A0\uFE0FWait for my confirmation then trade", "", t - 299000));
      }
      if (t + 300000 > now) out.push(mk("a" + e.date + name, "Trade Permission Allowed\u2705", "", t + 300000));
      var k = dayKey(e.d);
      (days[k] = days[k] || []).push(e);
    });
    Object.keys(days).forEach(function (k) {
      var at = new Date(k + "T" + ("0" + MORNING_HOUR).slice(-2) + ":00:00+05:00");
      var rest = days[k].filter(function (e) { return e.d > at; });
      if (at.getTime() <= now || !rest.length) return;
      var body = rest.map(function (e) { return e.country + " " + e.title + " \u2013 " + fmtTime(e.d); }).join("\n");
      out.push(mk("am" + k, "Aaj red folder news (" + rest.length + ")", body, at.getTime()));
    });
  }
  {
    var base = new Date(dayKey(new Date(now)) + "T00:00:00+05:00").getTime();
    for (var d = 0; d < 7; d++) {
      SL_REMINDERS.forEach(function (r) {
        var at2 = base + d * 86400000 + r.hour * 3600000;
        if (at2 <= now) return;
        out.push(mk(r.key + at2, r.title, "", at2));
      });
    }
  }
  return out;
}
function autoSchedule() {
  var LN = getLN(), s = $("sched");
  s.className = "status";
  if (!LN) {
    try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
    s.textContent = "Browser mode: alerts auto-on (page khula rakhein).";
    return Promise.resolve();
  }
  return setupAlerts(LN).then(function (ok) {
    if (!ok) { s.className = "status err"; s.textContent = "Notifications band hain. Phone Settings > Apps > Red Folder > Notifications on karein."; return; }
    var items = buildAlerts(events);
    return LN.getPending().then(function (p) {
      return p.notifications.length ? LN.cancel({ notifications: p.notifications.map(function (n) { return { id: n.id }; }) }) : null;
    }).then(function () {
      return items.length ? LN.schedule({ notifications: items }) : null;
    }).then(function () {
      s.textContent = "Alerts auto-on \u2022 " + items.length + " alerts set (agle 7 din ke liye)";
    });
  }).catch(function (e) { s.className = "status err"; s.textContent = "Alerts set nahi hue: " + (e && e.message ? e.message : e); });
}

var testBusy = false;
function countdown(lbl, at) {
  function tick() {
    var left = Math.max(0, Math.ceil((at - Date.now()) / 1000));
    lbl.textContent = left + "s";
    if (left > 0) { setTimeout(tick, 200); return; }
    setTimeout(function () { lbl.textContent = "Test"; testBusy = false; }, 1500);
  }
  tick();
}
$("testbtn").onclick = function () {
  var LN = getLN(), s = $("sched"), btn = $("testbtn"), lbl = btn.querySelector("span");
  if (testBusy) return;
  if (!LN) {
    s.className = "status";
    s.textContent = "Test sirf APK mein chalta hai.";
    if (lbl) { lbl.textContent = "APK"; setTimeout(function () { lbl.textContent = "Test"; }, 2000); }
    return;
  }
  testBusy = true;
  setupAlerts(LN).then(function (ok) {
    if (!ok) { testBusy = false; s.className = "status err"; s.textContent = "Notification permission allow karein."; return; }
    var at = Date.now() + 10000;
    return LN.schedule({ notifications: [{ id: 999999999, title: "Test: red folder alert", body: "Ye dikh raha hai to alerts theek hain.", schedule: { at: new Date(at), allowWhileIdle: true }, channelId: "redfolder" }] })
      .then(function () {
        s.className = "status";
        s.textContent = "Test alert 10 second mein aayega. App minimize kar dein.";
        if (lbl) countdown(lbl, at); else testBusy = false;
      });
  }).catch(function (e) { testBusy = false; s.className = "status err"; s.textContent = "Test fail: " + (e && e.message ? e.message : e); });
};

function verNum(v) {
  var m = String(v || "").match(/(\d+)$/);
  return m ? Number(m[1]) : 0;
}
function b64ToUtf8(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function parseRemoteJson(txt) {
  var s = String(txt || "").trim();
  if (!s) throw new Error("empty response");
  if (s.charAt(0) !== "{") s = b64ToUtf8(s);
  return JSON.parse(s);
}
var otaBusy = false;
var lastOtaCheck = 0;
function checkWebUpdate() {
  var elOta = $("ota");
  var repo = window.CURRENT_REPO || "";
  var curVer = window.CURRENT_VER || "";
  if (!window.Capacitor || !Capacitor.isNativePlatform || !Capacitor.isNativePlatform()) return;
  if (!repo || repo.indexOf("__") === 0) return;
  if (otaBusy || Date.now() - lastOtaCheck < 15000) return;
  otaBusy = true;
  lastOtaCheck = Date.now();
  elOta.className = "status";
  elOta.textContent = "OTA v" + curVer + " checking…";
  var base = "https://github.com/" + repo + "/releases/download/web-latest/";
  fetch(base + "version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(parseRemoteJson)
    .then(function (remote) {
      if (!remote || !remote.version) throw new Error("bad version.json");
      if (verNum(remote.version) <= verNum(curVer)) {
        elOta.textContent = "OTA v" + curVer + " (latest)";
        return;
      }
      elOta.textContent = "Updating v" + curVer + " \u2192 v" + remote.version + "…";
      return fetch(base + "app.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("app HTTP " + r.status); return r.text(); })
        .then(parseRemoteJson)
        .then(function (bundle) {
          if (!bundle || !bundle.version || !bundle.css || !bundle.body || !bundle.js) throw new Error("bad app.json");
          save("rf_ota_bundle", JSON.stringify(bundle));
          location.reload();
        });
    })
    .catch(function (e) {
      elOta.className = "status err";
      elOta.textContent = "OTA v" + curVer + " error: " + (e && e.message ? e.message : e);
    })
    .then(function () { otaBusy = false; });
}

function tickLive() {
  var now = new Date();
  updateClock(now);
  var c = document.querySelector(".cd");
  if (c) c.textContent = fmtCd(Number(c.getAttribute("data-t")) - now.getTime());
  var sig = stateSig(now);
  if (events.length && sig !== lastStateKey) {
    var dayChanged = dayKey(now) !== lastDayKey;
    render();
    if (dayChanged) autoSchedule();
  }
}

var saved = read("rf_filter");
if (saved) filter = saved;
checkWebUpdate();
load(false);
setInterval(tickLive, 1000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) checkWebUpdate(); });
//JS_END
</script>

<script id="app-boot">
(function () {
  var BUILTIN_VER = "__OTA_VER__";
  var OTA_REPO = "__OTA_REPO__";
  function vNum(v) {
    var m = String(v || "").match(/(\d+)$/);
    return m ? Number(m[1]) : 0;
  }
  window.CURRENT_REPO = OTA_REPO;
  var applied = false;
  try {
    var raw = localStorage.getItem("rf_ota_bundle");
    if (raw) {
      var b = JSON.parse(raw);
      if (b && b.version && b.css && b.body && b.js && vNum(b.version) > vNum(BUILTIN_VER)) {
        document.getElementById("app-css").textContent = b.css;
        document.getElementById("app-root").innerHTML = b.body;
        window.CURRENT_VER = b.version;
        (new Function(b.js))();
        applied = true;
      }
    }
  } catch (e) {
    try { localStorage.removeItem("rf_ota_bundle"); } catch (x) {}
    applied = false;
  }
  if (!applied) {
    window.CURRENT_VER = BUILTIN_VER;
    (new Function(document.getElementById("app-js").textContent))();
  }
})();
</script>
</body>
</html>

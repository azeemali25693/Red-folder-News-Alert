<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f5f9">
<title>Red folder news</title>
<style id="app-css">
/*CSS_START*/
:root{color-scheme:light;--bg:#f1f5f9;--card:#ffffff;--hdr:#f8fafc;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--accent:#2563eb;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:13.5px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:560px;margin:0 auto;padding:0 10px}
#bar{position:fixed;top:0;left:0;right:0;height:2.5px;z-index:9;overflow:hidden;opacity:0;transition:opacity .2s}
#bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:slide 1s ease-in-out infinite}
.loading #bar{opacity:1}
@keyframes slide{from{left:-40%}to{left:100%}}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 2px 10px}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.sub{color:var(--muted);font-size:12px;margin:2px 0 0;font-variant-numeric:tabular-nums}
button{font:inherit;border:0;cursor:pointer;color:inherit;transition:transform .12s,background .15s}
button:active{transform:scale(.96)}
.hbtns{display:flex;align-items:center;gap:8px;flex:none}
.icon{width:38px;height:38px;display:grid;place-items:center;background:var(--card);border:1px solid #cbd5e1;border-radius:50%;box-shadow:0 2px 6px rgba(15,23,42,.08)}
.loading #refresh svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.test3d{height:36px;padding:0 11px;border-radius:10px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.01em;color:#fff;background:linear-gradient(180deg,#f44336 0%,#d4261d 100%);border:1px solid #b91c1c;box-shadow:0 4px 0 #991b1b,0 6px 12px -4px rgba(212,38,29,.5);transition:transform .08s,box-shadow .08s;font-variant-numeric:tabular-nums;min-width:68px;justify-content:center}
.test3d:active{transform:translateY(3px);box-shadow:0 1px 0 #991b1b,0 2px 5px -2px rgba(212,38,29,.45)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid #cbd5e1;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.chip.on{background:#1e293b;color:#fff;border-color:#1e293b}
.tbl{background:var(--card);border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.tbl.today-tbl{border-color:#cbd5e1}
.tbl-h{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:var(--hdr);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:#334155;letter-spacing:.01em}
.tbl.today-tbl .tbl-h{background:#fff5f5;border-bottom-color:#fecaca;color:#991b1b}
.tbl-c{font-weight:600;font-size:11.5px;color:var(--muted)}
.tbl.today-tbl .tbl-c{color:#b91c1c}
.ev{display:grid;grid-template-columns:58px 50px 1fr auto;gap:2px 6px;padding:9px 10px;border-top:1px solid var(--line);align-items:center}
.ev:first-child{border-top:0}
.ev.past{opacity:.42}
.ev.next{background:#fffbeb;box-shadow:inset 3px 0 0 var(--red)}
.tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:#334155;white-space:nowrap}
.cur-w{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:#1e293b;white-space:nowrap}
.fld{flex:none;display:block}
.main{min-width:0}
.ttl{font-weight:600;font-size:13.5px;line-height:1.28;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:#334155;font-weight:600}
.cd{justify-self:end;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;padding:2px 6px;white-space:nowrap}
.empty{padding:14px 12px;font-size:13px;color:var(--muted);text-align:center}
.status{font-size:11.5px;color:var(--muted);margin:8px 0 0;text-align:center}
.status.err{color:#b91c1c}
.sk{border-radius:10px;background:linear-gradient(100deg,#fff 30%,#e2e8f0 50%,#fff 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.sk.h{height:150px;margin-bottom:10px}.sk.r{height:58px;margin-bottom:10px}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:2s!important}}
/*CSS_END*/
</style>
</head>
<body>
<div id="app-root">
<!--BODY_START-->
<div id="bar"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Red folder news</h1>
      <p class="sub" id="now"></p>
    </div>
    <div class="hbtns">
      <button class="test3d" id="testbtn" type="button" aria-label="Send test alert (10 sec)">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Test</span>
      </button>
      <button class="icon" id="refresh" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <section id="today"></section>
  <section id="week"></section>
  <p class="status" id="status">Loading…</p>
  <p class="status" id="sched"></p>
  <p class="status" id="ota"></p>
</div>
<!--BODY_END-->
</div>

<script id="app-js" type="text/plain">
//JS_START
var FEED = "https://nfs.faireconomy.media/ff_calendar_thisweek.json";
var PROXIES = [
  function (u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
  function (u) { return "https://corsproxy.io/?" + encodeURIComponent(u); }
];
var $ = function (id) { return document.getElementById(id); };
var events = [];
var filter = "ALL";
var lastList = [];
var lastRaw = "";
var lastStateKey = "";
var lastDayKey = "";
var nextEventTime = 0;
var testTimer = null;

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function folderIcon() {
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 16 14");
  svg.setAttribute("width", "13");
  svg.setAttribute("height", "11");
  svg.setAttribute("class", "fld");
  var p = document.createElementNS(ns, "path");
  p.setAttribute("fill", "#dc2626");
  p.setAttribute("d", "M1 2.5C1 1.67 1.67 1 2.5 1h3.6l1.4 1.5h6c.83 0 1.5.67 1.5 1.5v7.5c0 .83-.67 1.5-1.5 1.5h-11C1.67 13 1 12.33 1 11.5v-9z");
  svg.appendChild(p);
  return svg;
}

var TZ = "Asia/Karachi";
function dayKey(d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); }
function sameDay(a, b) { return dayKey(a) === dayKey(b); }
function fmtTime(d) { return d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) + " PKT"; }
function fmtClock(d) { return d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit" }); }
function fmtDay(d) { return d.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" }); }
function fmtCountdown(ms) {
  if (ms <= 0) return "Now";
  var s = Math.floor(ms / 1000);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  if (h >= 1) return h + "h " + m + "m";
  return m + ":" + (sec < 10 ? "0" : "") + sec;
}

function parse(data) {
  return data
    .filter(function (e) { return e.impact === "High"; })
    .map(function (e) { e.d = new Date(e.date); return e; })
    .filter(function (e) { return !isNaN(e.d); })
    .sort(function (a, b) { return a.d - b.d; });
}

function fetchFeed() {
  var urls = [FEED].concat(PROXIES.map(function (p) { return p(FEED); }));
  var i = 0;
  function next() {
    if (i >= urls.length) return Promise.reject(new Error("all failed"));
    return fetch(urls[i++], { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { if (!Array.isArray(d)) throw new Error("bad data"); return d; })
      .catch(next);
  }
  return next();
}

function eventRow(e, now, isNext) {
  var row = el("div", "ev" + (e.d < now && sameDay(e.d, now) ? " past" : "") + (isNext ? " next" : ""));
  row.appendChild(el("span", "tm", fmtTime(e.d).replace(" PKT", "")));

  var cur = el("span", "cur-w");
  cur.appendChild(folderIcon());
  cur.appendChild(document.createTextNode(e.country));
  row.appendChild(cur);

  var main = el("div", "main");
  main.appendChild(el("div", "ttl", e.title));
  if (e.forecast || e.previous) {
    var m = el("div", "meta");
    [["Fcst", e.forecast], ["Prev", e.previous]].forEach(function (x) {
      if (!x[1]) return;
      var sp = el("span", "", x[0] + " ");
      sp.appendChild(el("b", "", x[1]));
      m.appendChild(sp);
    });
    main.appendChild(m);
  }
  row.appendChild(main);

  if (isNext) {
    var cd = el("span", "cd", fmtCountdown(e.d - now));
    cd.id = "next-cd";
    row.appendChild(cd);
  }
  return row;
}

function skeleton() {
  var t = $("today"); t.textContent = ""; $("week").textContent = "";
  t.appendChild(el("div", "sk h"));
  for (var i = 0; i < 3; i++) t.appendChild(el("div", "sk r"));
}
function setLoading(on) {
  document.body.classList.toggle("loading", on);
  if (on && !events.length) skeleton();
}

function updateClock(now) {
  $("now").textContent = fmtDay(now) + " \u2022 " + fmtClock(now);
}

function stateSig(now) {
  return dayKey(now) + "|" + events.map(function (e) { return e.d < now ? "1" : "0"; }).join("");
}

function render() {
  var now = new Date();
  updateClock(now);
  lastStateKey = stateSig(now);
  lastDayKey = dayKey(now);

  var currencies = [];
  events.forEach(function (e) { if (currencies.indexOf(e.country) < 0) currencies.push(e.country); });
  var chips = $("chips");
  chips.textContent = "";
  ["ALL"].concat(currencies).forEach(function (c) {
    var b = el("button", "chip" + (c === filter ? " on" : ""), c === "ALL" ? "All" : c);
    b.type = "button";
    b.onclick = function () { filter = c; save("rf_filter", c); render(); autoSchedule(); };
    chips.appendChild(b);
  });

  var list = events.filter(function (e) { return filter === "ALL" || e.country === filter; });
  var today = list.filter(function (e) { return sameDay(e.d, now); });
  lastList = list;
  nextEventTime = 0;

  var box = $("today");
  box.textContent = "";
  var card = el("div", "tbl today-tbl");
  var hdr = el("div", "tbl-h");
  hdr.appendChild(el("span", "", "Today \u2022 " + fmtDay(now)));
  hdr.appendChild(el("span", "tbl-c", today.length ? today.length + (today.length === 1 ? " event" : " events") : "No events"));
  card.appendChild(hdr);

  if (today.length) {
    var body = el("div");
    var nextEv = null;
    today.forEach(function (e) { if (!nextEv && e.d >= now) nextEv = e; });
    if (nextEv) nextEventTime = nextEv.d.getTime();
    today.forEach(function (e) { body.appendChild(eventRow(e, now, e === nextEv)); });
    card.appendChild(body);
  } else {
    card.appendChild(el("div", "empty", filter === "ALL" ? "Aaj koi high-impact news nahi." : "Aaj " + filter + " ki koi high-impact news nahi."));
  }
  box.appendChild(card);

  var week = $("week");
  week.textContent = "";
  var days = {}, order = [];
  list.forEach(function (e) {
    if (sameDay(e.d, now) || e.d < now) return;
    var k = dayKey(e.d);
    if (!days[k]) { days[k] = []; order.push(k); }
    days[k].push(e);
  });
  order.forEach(function (k) {
    var tbl = el("div", "tbl");
    var th = el("div", "tbl-h");
    th.appendChild(el("span", "", fmtDay(days[k][0].d)));
    th.appendChild(el("span", "tbl-c", days[k].length + (days[k].length === 1 ? " event" : " events")));
    tbl.appendChild(th);
    var tb = el("div");
    days[k].forEach(function (e) { tb.appendChild(eventRow(e, now, false)); });
    tbl.appendChild(tb);
    week.appendChild(tbl);
  });

  document.title = today.length ? "Red: " + today.length + " today" : "Red folder news";
  return today;
}

function notify(today) {
  if (!today.length) return;
  var key = new Date().toDateString();
  if (read("rf_alerted") === key) return;
  save("rf_alerted", key);
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
  try {
    if (window.Notification && Notification.permission === "granted") {
      new Notification("Today: red folder news", {
        body: today.map(function (e) { return e.country + " " + e.title + " " + fmtTime(e.d); }).join("\n")
      });
    }
  } catch (e) {}
}

function load(silent) {
  var st = $("status");
  if (!silent) {
    setLoading(true);
    st.className = "status";
    st.textContent = "Loading…";
  }
  return fetchFeed().then(function (data) {
    var raw = JSON.stringify(data);
    var changed = raw !== lastRaw;
    lastRaw = raw;
    events = parse(data);
    save("rf_cache", raw);
    save("rf_time", String(Date.now()));
    st.className = "status";
    st.textContent = "Updated " + fmtTime(new Date());
    var today = render();
    notify(today);
    if (changed) autoSchedule();
  }).catch(function () {
    var cached = read("rf_cache");
    if (cached) {
      if (!events.length) {
        try { events = parse(JSON.parse(cached)); } catch (e) { events = []; }
        notify(render());
        autoSchedule();
      }
      var t = new Date(Number(read("rf_time")));
      st.className = "status err";
      st.textContent = "Internet ya feed nahi mila. Purana data dikh raha hai (" + t.toLocaleString() + ").";
    } else {
      st.className = "status err";
      st.textContent = "News load nahi hui. Internet check karke Refresh dabayein.";
      render();
    }
  }).then(function () { if (!silent) setLoading(false); });
}

$("refresh").onclick = function () {
  load(false);
  checkWebUpdate();
};

var MORNING_HOUR = 8;
function getLN() {
  try { if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return Capacitor.Plugins.LocalNotifications || null; } catch (e) {}
  return null;
}
function hashId(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; }
function setupAlerts(LN) {
  return LN.requestPermissions().then(function (p) {
    if (p.display !== "granted") return false;
    return LN.createChannel({ id: "redfolder", name: "Red folder news", description: "High impact news alerts", importance: 5, visibility: 1, vibration: true })
      .then(function () { return true; }, function () { return true; });
  });
}
var SL_MSG = "Don't Revenge trade if SL hitt your day done \u26A0\uFE0F\u2705";
var SL_REMINDERS = [
  { hour: 7, key: "sl7", title: SL_MSG },
  { hour: 19, key: "sl19", title: SL_MSG }
];
function mk(key, title, body, atMs) {
  var n = { id: hashId(key), title: title, body: body, schedule: { at: new Date(atMs), allowWhileIdle: true }, channelId: "redfolder" };
  if (body) n.largeBody = body;
  return n;
}
function buildAlerts(list) {
  var now = Date.now(), out = [], days = {};
  {
    list.forEach(function (e) {
      var t = e.d.getTime(), name = e.country + " " + e.title;
      var tail = [e.forecast ? "Forecast " + e.forecast : "", e.previous ? "Previous " + e.previous : ""].filter(Boolean).join(" | ");
      if (t - 300000 > now) {
        out.push(mk("b" + e.date + name, name + " \u2013 5 min baad", "News " + fmtTime(e.d) + (tail ? "\n" + tail : ""), t - 300000));
        out.push(mk("w" + e.date + name, "\u26A0\uFE0FWait for my confirmation then trade", "", t - 299000));
      }
      if (t + 300000 > now) out.push(mk("a" + e.date + name, "Trade Permission Allowed\u2705", "", t + 300000));
      var k = dayKey(e.d);
      (days[k] = days[k] || []).push(e);
    });
    Object.keys(days).forEach(function (k) {
      var at = new Date(k + "T" + ("0" + MORNING_HOUR).slice(-2) + ":00:00+05:00");
      var rest = days[k].filter(function (e) { return e.d > at; });
      if (at.getTime() <= now || !rest.length) return;
      var body = rest.map(function (e) { return e.country + " " + e.title + " \u2013 " + fmtTime(e.d); }).join("\n");
      out.push(mk("am" + k, "Aaj red folder news (" + rest.length + ")", body, at.getTime()));
    });
  }
  {
    var base = new Date(dayKey(new Date(now)) + "T00:00:00+05:00").getTime();
    for (var d = 0; d < 7; d++) {
      SL_REMINDERS.forEach(function (r) {
        var at2 = base + d * 86400000 + r.hour * 3600000;
        if (at2 <= now) return;
        out.push(mk(r.key + at2, r.title, "", at2));
      });
    }
  }
  return out;
}
function autoSchedule() {
  var LN = getLN(), s = $("sched");
  s.className = "status";
  if (!LN) {
    try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
    s.textContent = "Browser mode: alerts auto-on (page khula rakhein).";
    return Promise.resolve();
  }
  return setupAlerts(LN).then(function (ok) {
    if (!ok) { s.className = "status err"; s.textContent = "Notifications band hain. Phone Settings > Apps > Red Folder > Notifications on karein."; return; }
    var items = buildAlerts(events);
    return LN.getPending().then(function (p) {
      return p.notifications.length ? LN.cancel({ notifications: p.notifications.map(function (n) { return { id: n.id }; }) }) : null;
    }).then(function () {
      return items.length ? LN.schedule({ notifications: items }) : null;
    }).then(function () {
      s.textContent = "Alerts auto-on \u2022 " + items.length + " alerts set (agle 7 din ke liye)";
    });
  }).catch(function (e) { s.className = "status err"; s.textContent = "Alerts set nahi hue: " + (e && e.message ? e.message : e); });
}

function startTestCountdown(lbl) {
  if (testTimer) clearInterval(testTimer);
  var end = Date.now() + 10000;
  function step() {
    var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    lbl.textContent = left + "s";
    if (left <= 0) {
      clearInterval(testTimer);
      testTimer = null;
      setTimeout(function () { lbl.textContent = "Test"; }, 1000);
    }
  }
  step();
  testTimer = setInterval(step, 250);
}

$("testbtn").onclick = function () {
  var LN = getLN(), s = $("sched"), btn = $("testbtn"), lbl = btn.querySelector("span");
  if (!LN) {
    s.className = "status";
    s.textContent = "Test sirf APK mein chalta hai.";
    if (lbl) { lbl.textContent = "APK"; setTimeout(function () { lbl.textContent = "Test"; }, 2000); }
    return;
  }
  setupAlerts(LN).then(function (ok) {
    if (!ok) { s.className = "status err"; s.textContent = "Notification permission allow karein."; return; }
    return LN.schedule({ notifications: [{ id: 999999999, title: "Test: red folder alert", body: "Ye dikh raha hai to alerts theek hain.", schedule: { at: new Date(Date.now() + 10000), allowWhileIdle: true }, channelId: "redfolder" }] })
      .then(function () {
        s.className = "status";
        s.textContent = "Test alert 10 second mein aayega. App minimize kar dein.";
        if (lbl) startTestCountdown(lbl);
      });
  }).catch(function (e) { s.className = "status err"; s.textContent = "Test fail: " + (e && e.message ? e.message : e); });
};

function verNum(v) {
  var m = String(v || "").match(/(\d+)$/);
  return m ? Number(m[1]) : 0;
}
function b64ToUtf8(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function parseRemoteJson(txt) {
  var s = String(txt || "").trim();
  if (!s) throw new Error("empty response");
  if (s.charAt(0) !== "{") s = b64ToUtf8(s);
  return JSON.parse(s);
}
var otaBusy = false;
var lastOtaCheck = 0;
function checkWebUpdate() {
  var elOta = $("ota");
  var repo = window.CURRENT_REPO || "";
  var curVer = window.CURRENT_VER || "";
  if (!window.Capacitor || !Capacitor.isNativePlatform || !Capacitor.isNativePlatform()) return;
  if (!repo || repo.indexOf("__") === 0) return;
  if (otaBusy || Date.now() - lastOtaCheck < 15000) return;
  otaBusy = true;
  lastOtaCheck = Date.now();
  elOta.className = "status";
  elOta.textContent = "OTA v" + curVer + " checking…";
  var base = "https://github.com/" + repo + "/releases/download/web-latest/";
  fetch(base + "version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(parseRemoteJson)
    .then(function (remote) {
      if (!remote || !remote.version) throw new Error("bad version.json");
      if (verNum(remote.version) <= verNum(curVer)) {
        elOta.textContent = "OTA v" + curVer + " (latest)";
        return;
      }
      elOta.textContent = "Updating v" + curVer + " \u2192 v" + remote.version + "…";
      return fetch(base + "app.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("app HTTP " + r.status); return r.text(); })
        .then(parseRemoteJson)
        .then(function (bundle) {
          if (!bundle || !bundle.version || !bundle.css || !bundle.body || !bundle.js) throw new Error("bad app.json");
          save("rf_ota_bundle", JSON.stringify(bundle));
          location.reload();
        });
    })
    .catch(function (e) {
      elOta.className = "status err";
      elOta.textContent = "OTA v" + curVer + " error: " + (e && e.message ? e.message : e);
    })
    .then(function () { otaBusy = false; });
}

function tickLive() {
  var now = new Date();
  updateClock(now);
  var cd = $("next-cd");
  if (cd && nextEventTime) cd.textContent = fmtCountdown(nextEventTime - now.getTime());
  var sig = stateSig(now);
  if (events.length && sig !== lastStateKey) {
    var dayChanged = dayKey(now) !== lastDayKey;
    render();
    if (dayChanged) autoSchedule();
  }
}

var saved = read("rf_filter");
if (saved) filter = saved;
checkWebUpdate();
load(false);
setInterval(tickLive, 1000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) checkWebUpdate(); });
//JS_END
</script>

<script id="app-boot">
(function () {
  var BUILTIN_VER = "__OTA_VER__";
  var OTA_REPO = "__OTA_REPO__";
  function vNum(v) {
    var m = String(v || "").match(/(\d+)$/);
    return m ? Number(m[1]) : 0;
  }
  window.CURRENT_REPO = OTA_REPO;
  var applied = false;
  try {
    var raw = localStorage.getItem("rf_ota_bundle");
    if (raw) {
      var b = JSON.parse(raw);
      if (b && b.version && b.css && b.body && b.js && vNum(b.version) > vNum(BUILTIN_VER)) {
        document.getElementById("app-css").textContent = b.css;
        document.getElementById("app-root").innerHTML = b.body;
        window.CURRENT_VER = b.version;
        (new Function(b.js))();
        applied = true;
      }
    }
  } catch (e) {
    try { localStorage.removeItem("rf_ota_bundle"); } catch (x) {}
    applied = false;
  }
  if (!applied) {
    window.CURRENT_VER = BUILTIN_VER;
    (new Function(document.getElementById("app-js").textContent))();
  }
})();
</script>
</body>

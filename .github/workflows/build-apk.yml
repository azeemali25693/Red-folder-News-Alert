name: Build APK & OTA Update

on:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_apk: ${{ steps.filter.outputs.build_apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build="true"
          elif ! gh release view apk-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            build="true"
          elif ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            build="true"
          elif git diff --name-only HEAD~1 HEAD | grep -Eq '^(package\.json|package-lock\.json|capacitor\.config\.json|\.github/workflows/|assets/|icon\.png|images\.png)'; then
            build="true"
          fi
          echo "build_apk=$build" >> "$GITHUB_OUTPUT"

  web-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Official Forex Factory Calendar
        run: |
          curl -sSL "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o ff_calendar.json || echo "[]" > ff_calendar.json
      - name: Package OTA JSON
        env:
          VER: 1.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const pick = (a, b) => {
            const s = html.indexOf(a), e = html.indexOf(b);
            if (s < 0 || e < 0 || e <= s) throw new Error('Missing marker: ' + a);
            return html.slice(s + a.length, e).trim();
          };
          const app = {
            version: process.env.VER,
            css: pick('/*CSS_START*/', '/*CSS_END*/'),
            body: pick('<!--BODY_START-->', '<!--BODY_END-->'),
            js: pick('//JS_START', '//JS_END')
          };
          fs.writeFileSync('app.json', JSON.stringify(app));
          fs.writeFileSync('version.json', JSON.stringify({
            version: process.env.VER,
            repo: process.env.REPO
          }));
          EOF
      - name: Publish OTA update to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: web-latest
          name: Web Update (Latest)
          prerelease: true
          files: |
            app.json
            version.json
            ff_calendar.json

  build-apk:
    needs: [check, web-update]
    if: needs.check.outputs.build_apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Disable splash screen (launch app directly)
        run: |
          sed -i 's/AppTheme\.NoActionBarLaunch/AppTheme.NoActionBar/g' android/app/src/main/AndroidManifest.xml
      - name: Stamp built-in OTA version
        env:
          VER: 1.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          let html = fs.readFileSync('www/index.html', 'utf8');
          html = html.replace('__OTA_VER__', process.env.VER).replace('__OTA_REPO__', process.env.REPO);
          fs.writeFileSync('www/index.html', html);
          EOF
      - name: Add alarm permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk red-folder.apk
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: Red Folder APK
          files: red-folder.apk

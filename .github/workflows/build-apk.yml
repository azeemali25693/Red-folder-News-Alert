name: Build APK & OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_apk: ${{ steps.filter.outputs.build_apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build="true"
          elif ! gh release view apk-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            build="true"
          elif ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            build="true"
          elif git diff --name-only HEAD~1 HEAD | grep -Eq '^(package\.json|package-lock\.json|capacitor\.config\.json|\.github/workflows/|assets/|icon\.png|images\.png)'; then
            build="true"
          fi
          echo "build_apk=$build" >> "$GITHUB_OUTPUT"

  web-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package OTA JSON
        env:
          VER: 1.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const pick = (a, b) => {
            const s = html.indexOf(a), e = html.indexOf(b);
            if (s < 0 || e < 0 || e <= s) throw new Error('Missing marker: ' + a);
            return html.slice(s + a.length, e).trim();
          };
          const app = {
            version: process.env.VER,
            css: pick('/*CSS_START*/', '/*CSS_END*/'),
            body: pick('<!--BODY_START-->', '<!--BODY_END-->'),
            js: pick('//JS_START', '//JS_END')
          };
          fs.writeFileSync('app.json', JSON.stringify(app));
          fs.writeFileSync('version.json', JSON.stringify({
            version: process.env.VER,
            repo: process.env.REPO
          }));
          EOF
      - name: Publish OTA update to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: web-latest
          name: Web Update (Latest)
          prerelease: true
          files: |
            app.json
            version.json

  build-apk:
    needs: [check, web-update]
    if: needs.check.outputs.build_apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Generate app icon
        if: hashFiles('icon.png', 'images.png', 'assets/*') != ''
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          if [ -f icon.png ]; then cp icon.png assets/logo.png
          elif [ -f images.png ]; then cp images.png assets/logo.png
          fi
          BG=$(node -e "const fs=require('fs'),s=require('sharp');const src=fs.existsSync('assets/icon.png')?'assets/icon.png':'assets/logo.png';(async()=>{const {data}=await s(src).ensureAlpha().raw().toBuffer({resolveWithObject:true});const bg=data[3]<200?'#ffffff':'#'+[data[0],data[1],data[2]].map(x=>x.toString(16).padStart(2,'0')).join('');await s(src).resize(1024,1024,{fit:'contain',background:data[3]<200?{r:0,g:0,b:0,alpha:0}:bg}).png().toFile('assets/_logo.png');fs.renameSync('assets/_logo.png','assets/logo.png');console.log(bg);})();")
          npx @capacitor/assets generate --android --iconBackgroundColor "$BG"
      - name: Disable splash screen (launch app directly)
        run: |
          sed -i 's/AppTheme\.NoActionBarLaunch/AppTheme.NoActionBar/g' android/app/src/main/AndroidManifest.xml
      - name: Stamp built-in OTA version
        env:
          VER: 1.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          let html = fs.readFileSync('www/index.html', 'utf8');
          html = html.replace('__OTA_VER__', process.env.VER).replace('__OTA_REPO__', process.env.REPO);
          fs.writeFileSync('www/index.html', html);
          EOF
      - name: Add alarm permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Add red dot notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_redfolder.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,12m-8,0a8,8 0,1,0 16,0a8,8 0,1,0 -16,0"/>
          </vector>
          EOF
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.plugins=c.plugins||{};c.plugins.LocalNotifications={smallIcon:'ic_stat_redfolder',iconColor:'#D6291F'};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk red-folder.apk
      - name: Publish APK to GitHub Release (direct .apk, no zip)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: Red Folder APK
          files: red-folder.apk
      - name: Upload APK artifact (no zip)
        uses: actions/upload-artifact@v7
        with:
          path: red-folder.apk
          archive: false

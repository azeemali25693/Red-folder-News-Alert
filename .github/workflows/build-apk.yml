name: Build APK & OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_apk: ${{ steps.filter.outputs.build_apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build="true"
          elif ! gh release view apk-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            build="true"
          elif ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            build="true"
          elif git diff --name-only HEAD~1 HEAD | grep -Eq '^(package\.json|package-lock\.json|capacitor\.config\.json|\.github/workflows/)'; then
            build="true"
          fi
          echo "build_apk=$build" >> "$GITHUB_OUTPUT"

  web-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package web bundle
        run: |
          VER="1.0.${{ github.run_number }}"
          printf 'window.OTA_INFO={"version":"%s","repo":"%s"};\n' "$VER" "${{ github.repository }}" > www/ota.js
          printf '{"version":"%s","repo":"%s"}\n' "$VER" "${{ github.repository }}" > www/ota.json
          (cd www && zip -r ../web-bundle.zip *)
          printf '{"version":"%s","url":"https://github.com/%s/releases/download/web-latest/web-bundle.zip"}\n' "$VER" "${{ github.repository }}" > version.json
      - name: Publish OTA update to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: web-latest
          name: Web Update (Latest)
          prerelease: true
          files: |
            web-bundle.zip
            version.json

  build-apk:
    needs: [check, web-update]
    if: needs.check.outputs.build_apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Stamp initial OTA version
        run: |
          VER="1.0.${{ github.run_number }}"
          printf 'window.OTA_INFO={"version":"%s","repo":"%s"};\n' "$VER" "${{ github.repository }}" > www/ota.js
          printf '{"version":"%s","repo":"%s"}\n' "$VER" "${{ github.repository }}" > www/ota.json
      - name: Add alarm permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Add red dot notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_redfolder.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,12m-8,0a8,8 0,1,0 16,0a8,8 0,1,0 -16,0"/>
          </vector>
          EOF
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.plugins=c.plugins||{};c.plugins.LocalNotifications={smallIcon:'ic_stat_redfolder',iconColor:'#D6291F'};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk red-folder.apk
      - name: Publish APK to GitHub Release (direct .apk, no zip)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: Red Folder APK
          files: red-folder.apk
      - name: Upload APK artifact (no zip)
        uses: actions/upload-artifact@v7
        with:
          path: red-folder.apk
          archive: false
